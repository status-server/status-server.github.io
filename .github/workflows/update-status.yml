name: Update Minecraft Status Card

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  update-card:
    runs-on: self-hosted  
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-requests python3-pil

      - name: Run status generator script
        run: python3 script/gen_status_card.py

      - name: Commit and push status updates
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add games/minecraft/server/saintontas_mc/statuscard/
          git diff --staged --quiet || git commit -m "chore: auto-update Minecraft status card [skip ci]"
          git push
