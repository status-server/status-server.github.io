name: Update Minecraft Status Card

on:
  schedule:
    
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system font dependencies
        run: sudo apt-get update && sudo apt-get install -y ttf-mscorefonts-installer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Run status generator script
        run: python "$GITHUB_WORKSPACE/script/gen_status_card.py"

      - name: Check where files were generated (Debug)
        run: |
          echo "Checking generated files:"
          find . -name "status.png" -o -name "history.json"

      - name: Commit and push updated status image and history
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add files safely
          git add games/minecraft/server/saintontas_mc/statuscard/status.png games/minecraft/server/saintontas_mc/statuscard/history.json || true
          
          git diff --staged --quiet || git commit -m "Auto-update status card and player history [skip ci]"
          git push
